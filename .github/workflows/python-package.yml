# Lint, type-check, test (across Python and pandas versions), and check the build.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # lets the publish workflow require these checks to pass

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Type-check with mypy
        run: mypy htstools

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        pandas: ["pandas>=2,<3", "pandas>=3"]
        exclude:
          # pandas 3 requires Python 3.11 or newer
          - python-version: "3.10"
            pandas: "pandas>=3"
    env:
      PANDAS_SPEC: ${{ matrix.pandas }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "$PANDAS_SPEC"
      - name: Test with pytest (unit tests and doctests)
        run: >
          pytest
          --cov=htstools --cov-report=xml
          --junitxml=test-results.xml
      - name: Test command-line pipelines on example data
        run: |
          bash test/scripts/test-plate-tab.sh
          bash test/scripts/test-row-xlsx.sh
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}  # publish results even when tests fail
        with:
          name: pytest-results-py${{ matrix.python-version }}-${{ strategy.job-index }}
          path: |
            test-results.xml
            coverage.xml

  min-versions:
    # Tests the oldest versions of the direct dependencies that pyproject.toml declares.
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install lowest supported dependencies on the oldest supported Python
        run: |
          uv venv --python 3.10 .venv
          uv pip install --python .venv/bin/python --resolution lowest-direct -e ".[test]"
      - name: Test with pytest
        run: .venv/bin/python -m pytest
      - name: Test command-line pipelines on example data
        run: |
          PATH="$PWD/.venv/bin:$PATH" bash test/scripts/test-plate-tab.sh
          PATH="$PWD/.venv/bin:$PATH" bash test/scripts/test-row-xlsx.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"
      - name: Build documentation (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Upload distributions (the release workflow publishes exactly these files)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean environment and run the CLI
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/hts --help
