# Run the full checks on the release commit, then publish the distributions they built and tested.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Lint, type-check and test the exact commit being released.
  checks:
    uses: ./.github/workflows/python-package.yml

  publish:
    # Publishes the sdist and wheel that the checks workflow built and install-tested.
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # lets PyPI "trusted publishing" work if it is configured for this repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3 (Dependabot keeps this pin current)
        with:
          # The API token is used while it is set. To switch to trusted publishing,
          # register this workflow and the `pypi` environment on PyPI and delete the two lines below.
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
